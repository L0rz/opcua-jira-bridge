# ============================================================
# OPC UA → Jira Bridge — Konfiguration für echten SWEDLOG/SIMULATED Server
# ============================================================

server:
  endpoint: "opc.tcp://Deltafrigo:48010"
  timeout: 10
  reconnect_interval: 5

  # Username-Auth
  auth_mode: username
  username: "OPC"
  password: "OPC"

  security_policy: None
  security_mode: None


# ============================================================
# Namespace-Konfiguration
# ============================================================
namespace:
  # Auto: versucht URI-Discovery, fällt auf Index 2 zurück
  discovery_mode: auto
  uri: ""
  index: 2


# ============================================================
# Alarm-Nodes (Mehrere Alarme)
# ============================================================
# NodeIDs aus OPC UA Browser (NS2, String-basiert)
# trigger_value: true → Alarm aktiv, false → Alarm gelöst (Auto-Resolve)

alarms:
  - key: "FEEDBACK_MOTOR1"
    label: "Motor 1 Feedback Failure"
    description: "Failure on Motor 1 running signal feedback"
    nodeid: "ns=2;s=SIMULATED.DataStructure.ROOMS.ROOM1.ALARMS.FEEDBACK_MOTOR1"
    priority: "High"

  - key: "PHASE_LOSS"
    label: "Phase Loss"
    description: "Phase loss detected"
    nodeid: "ns=2;s=SIMULATED.DataStructure.ROOMS.ROOM1.ALARMS.PHASE_LOSS"
    priority: "Highest"

  - key: "PUMP_OVERLOAD"
    label: "Solution Pump Overload"
    description: "Solution Pump Overload"
    nodeid: "ns=2;s=SIMULATED.DataStructure.ROOMS.ROOM1.ALARMS.PUMP_OVERLOAD"
    priority: "High"


# ============================================================
# Kontext-Nodes (werden ins Ticket geschrieben)
# ============================================================
# ROOM_ID liegt unter ROOM1/MISC/ROOM_ID (nicht direkt in ROOM1)
context_nodes:
  - key: "client_id"
    label: "Client ID"
    nodeid: "ns=2;s=SIMULATED.DataStructure.CLIENT_ID"

  - key: "room_id"
    label: "Room ID"
    nodeid: "ns=2;s=SIMULATED.DataStructure.ROOMS.ROOM1.MISC.ROOM_ID"

  - key: "server_datetime"
    label: "Server Timestamp"
    nodeid: "ns=2;s=SIMULATED.DataStructure.SERVER_DATETIME"

  - key: "comm_plc_quality"
    label: "PLC Communication Quality"
    nodeid: "ns=2;s=SIMULATED.DataStructure.COMM_PLC_QUALITY"


# ============================================================
# Alarm-Verhalten
# ============================================================
alarm:
  # Wert der den Alarm auslöst
  trigger_value: true

  # Dedup: gleicher Alarm nicht doppelt melden (Sekunden)
  dedup_cooldown: 300

  # Ticket automatisch auf "Gelöst" setzen wenn Alarm wieder false
  auto_resolve: true

  # Jira Transition ID für "Gelöst"
  # Mögliche Werte holen via: GET /rest/api/2/issue/{issueKey}/transitions
  resolve_transition_id: "5"    # RKS Projekt: 5 = "Resolve Issue" → Status "Resolved"
  resolve_comment: "Alarm automatisch gelöst: OPC UA Node zurück auf FALSE."


# ============================================================
# Jira-Ticket Konfiguration
# ============================================================
jira:
  issue_type: "Incident"
  auto_assign: true

  # Summary: verfügbare Variablen: {alarm_label}, {alarm_key}, {client_id}, {room_id}
  summary_template: "[OPC UA] {client_id} / {room_id} — {alarm_label}"

  labels:
    - "opcua"
    - "automated"
    - "alarm"
