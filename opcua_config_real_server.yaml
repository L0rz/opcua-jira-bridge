# ============================================================
# OPC UA → Jira Bridge — Konfiguration für echten SWEDLOG/SIMULATED Server
# ============================================================

server:
  endpoint: "opc.tcp://Deltafrigo:48010"
  timeout: 10
  reconnect_interval: 5

  # Username-Auth
  auth_mode: username
  username: "OPC"
  password: "OPC"

  security_policy: None
  security_mode: None


# ============================================================
# Namespace-Konfiguration
# ============================================================
namespace:
  # Auto: versucht URI-Discovery, fällt auf Index 2 zurück
  discovery_mode: auto
  uri: ""
  index: 2


# ============================================================
# Root Paths — Auto-Discovery
# ============================================================
# Bridge browst automatisch alle ROOMS/*/ALARMS/* unter jedem Root-Path.
# Kontext-Nodes (CLIENT_ID, ROOM_ID, etc.) werden pro Room automatisch gelesen.
# Nur "SIMULATED" zum Testen, "SWEDLOG" für echte PLC-Daten.
root_paths:
  - "SIMULATED"
  # - "SWEDLOG"    # Einkommentieren wenn echte PLCs überwacht werden sollen


# ============================================================
# Alarm-Verhalten
# ============================================================
alarm:
  # Wert der den Alarm auslöst
  trigger_value: true

  # Dedup: gleicher Alarm nicht doppelt melden (Sekunden)
  dedup_cooldown: 300

  # Default-Priority für auto-discovered Alarme
  default_priority: "High"

  # Poll-Intervall in Sekunden (Elipse E3 unterstützt keine Subscriptions)
  poll_interval: 5

  # Ticket automatisch auf "Gelöst" setzen wenn Alarm wieder false
  auto_resolve: true

  # Jira Transition ID für "Gelöst"
  # Mögliche Werte holen via: GET /rest/api/2/issue/{issueKey}/transitions
  resolve_transition_id: "5"    # RKS Projekt: 5 = "Resolve Issue" → Status "Resolved"
  resolve_comment: "Alarm automatically resolved: OPC UA Node returned to FALSE."


# ============================================================
# Jira-Ticket Konfiguration
# ============================================================
jira:
  issue_type: "Incident"
  auto_assign: true

  # Summary: verfügbare Variablen: {alarm_label}, {alarm_key}, {client_id}, {room_id}
  summary_template: "[OPC UA] {client_id} / {room_id} — {alarm_label}"

  labels:
    - "opcua"
    - "automated"
    - "alarm"
